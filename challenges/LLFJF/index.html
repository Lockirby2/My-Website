<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Lockirby2 - LLFJF</title>
        <link href="/style.css" rel="stylesheet" type="text/css" media="all">
        <script src="/components/helpers.js" type="module"></script>
        <script src="/components/top-bar.js" type="text/javascript" defer></script>
        <script src="/components/breadcrumbs.js" type="text/javascript" defer></script>
        <script src="/components/navigator.js" type="module" defer></script>
        <script src="/components/navigator-toggle.js" type="module" defer></script>
        <script src="/components/navigator-button.js" type="module" defer></script>
        <script src="/components/main-body.js" type="text/javascript" defer></script>
        <script src="/components/file-text.js" type="text/javascript" defer></script>
        <script src="/components/video.js" type="text/javascript" defer></script>
        <script src="/components/video-loader.js" type="text/javascript" defer></script>
    </head>
    <body>
        <c-top-bar>
            <a class="breadcrumb" href="https://lockirby2.neocities.org">Home</a>
            <a class="breadcrumb" href="https://lockirby2.neocities.org/challenges">Challenges</a>
        </c-top-bar>
        <div class="content">
            <div class="left-margin">
                <c-navigator role="menu" aria-label="Navigator"></c-navigator>
                <c-navigator-toggle></c-navigator-toggle>
            </div>
            <c-main-body>
                <h1>Low Level Four Job Fiesta</h1>
                <c-file-text filepath="text/Summary.txt"></c-file-text>
                
                <h1 id="ultros-one">Ultros 1</h1>
                <c-file-text filepath="text/1Ultros1.txt"></c-file-text>
                <c-video video-id="oeKIUYrFgLw"></c-video>
                
                <h1 id="magitek-facility">Magitek Facility</h1>
                <c-file-text filepath="text/2MagitekFacility.txt"></c-file-text>
                <c-video video-id="w77OElSM8EA"></c-video>
                
                <h1 id="flame-eater">Flame Eater</h1>
                <c-file-text filepath="text/3FlameEater.txt"></c-file-text>
                <c-video video-id="uFDDrzv7UN0"></c-video>
                
                <h1 id="iaf">IAF Sequence</h1>
                <c-file-text filepath="text/4Iaf.txt"></c-file-text>
                <c-video video-id="nghmEY3jFfo"></c-video>
                
                <h1 id="atma-weapon">Atma Weapon (No Jump)</h1>
                <c-file-text filepath="text/5AtmaWeapon.txt"></c-file-text>
                <c-video video-id="zJWqOPPBMjM"></c-video>
                
                <h1 id="fc-escape">Floating Continent Escape</h1>
                <c-file-text filepath="text/6FcEscape.txt"></c-file-text>
                <c-video video-id="_EqYKn5mpNA"></c-video>
                
                <h1 id="tentacles">Tentacles</h1>
                <c-file-text filepath="text/7Tentacles.txt"></c-file-text>
                <c-video video-id="D_aph6crV9k"></c-video>
                
                <h1 id="final-battle">Final Battle</h1>
                <c-file-text filepath="text/8FinalBattle.txt"></c-file-text>
                <c-video video-id="BJyFiC7js74"></c-video>
                
                <h1 id="other-battles">Other (Less Interesting) Battles</h1>
                <c-file-text filepath="text/9OtherBattles.txt"></c-file-text>
                <c-video video-id="Y0FCfc5Mok0"></c-video>
            </c-main-body>
            <div class="right-margin desktop-only">
                <c-video-loader></c-video-loader>
            </div>
        </div>
    </body>
</html>
